name: Build daisy and run tests on linux

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake libsuitesparse-dev libboost-filesystem-dev libgtest-dev python3-pybind11

    - name: Install uv for testing
      uses: astral-sh/setup-uv@v10.0.1
      with:
        version: "0.9.18"
        enable-cache: true

    - name: Install python
      run: uv python install 3.13

    - name: Create build dir
      run: mkdir ci-build

    - name: Configure CMake
      working-directory: ci-build
      run: cmake .. --preset linux-gcc-portable -DBUILD_CXX_TESTS=ON

    - name: Build
      working-directory: ci-build
      run: cmake --build . -j 4

    - name: Upload build tree
      uses: actions/upload-artifact@v5
      with:
        name: ci-build-linux
        path: ci-build
        if-no-files-found: error

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake libsuitesparse-dev libboost-filesystem-dev libgtest-dev python3-pybind11

    - name: Install uv for testing
      uses: astral-sh/setup-uv@v7
      with:
        version: "0.9.18"
        enable-cache: true

    - name: Install python
      run: uv python install 3.13

    - name: Download build tree
      uses: actions/download-artifact@v4
      with:
        name: ci-build-linux
        path: .

    - name: Setup test environment
      working-directory: ci-build
      run: |
        uv venv
        uv pip install git+https://github.com/daisy-model/daisypy-test

    - name: Test
      working-directory: ci-build
      run: ctest --output-on-failure

    - name: Upload test log
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: test-output-ubuntu
        path: ci-build/Testing
