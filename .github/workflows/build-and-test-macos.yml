name: Build daisy and run tests on MacOS

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build and C++ unit test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}

    steps:
    - uses: actions/checkout@v7

    - name: Remove unused untrusted Homebrew tap
      run: brew untap aws/tap || true

    - name: Install build dependencies using brew
      run: brew install cmake boost googletest suite-sparse pybind11

    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        version: "0.9.18"
        enable-cache: false

    - name: Install python
      run: uv python install 3.13

    - name: Create build dir
      run: mkdir ci-build

    - name: Configure CMake
      working-directory: ci-build
      run: >
        cmake ..
        -DUV_INSTALLED_PYTHON_ROOT_DIR=$( ls -d $( uv python dir )/* | grep 3.13 )
        -DBUILD_CXX_TESTS=ON
        --preset macos-clang-portable

    - name: Build
      working-directory: ci-build
      run: cmake --build . -j 4

    - name: Run gating C++ unit tests
      working-directory: ci-build
      run: ctest -L cxx-unit -LE known-failure --output-on-failure

    - name: Run known failing C++ unit tests
      if: ${{ always() }}
      continue-on-error: true
      working-directory: ci-build
      run: ctest -L cxx-unit -L known-failure --output-on-failure

    - name: Pack
      working-directory: ci-build
      run: cpack -G ZIP

    - name: Build packaged test bundle
      run: make test-bundle

    - name: Upload test log
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: test-output-macos-${{ matrix.arch }}
        path: ci-build/Testing

    - name: Upload macOS package
      uses: actions/upload-artifact@v7
      with:
        name: ci-macos-package-${{ matrix.arch }}
        path: ci-build/daisy-*-Darwin-*-python*.zip
        if-no-files-found: error

    - name: Upload macOS test bundle
      uses: actions/upload-artifact@v7
      with:
        name: ci-macos-test-bundle-${{ matrix.arch }}
        path: build/test-bundle/*.zip
        if-no-files-found: error

  package-test:
    name: Package test (${{ matrix.arch }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}

    steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        version: "0.9.18"
        enable-cache: false

    - name: Install python
      run: uv python install 3.13

    - name: Download macOS package
      uses: actions/download-artifact@v8
      with:
        name: ci-macos-package-${{ matrix.arch }}
        path: ci-package

    - name: Download macOS test bundle
      uses: actions/download-artifact@v8
      with:
        name: ci-macos-test-bundle-${{ matrix.arch }}
        path: ci-test-bundle

    - name: Unpack package and test bundle
      run: |
        unzip ci-package/*.zip -d ci-install
        unzip ci-test-bundle/*.zip -d ci-test-bundle

    - name: Run packaged tests
      run: |
        bundle_root="$(find ci-test-bundle -maxdepth 1 -type d -name 'daisy-test-suite-*' -print -quit)"
        daisy_bin="$(find ci-install -type f -path '*/Daisy/bin/daisy' -print -quit)"
        if [ -z "$bundle_root" ]; then
          echo "Packaged test bundle not found." >&2
          exit 1
        fi
        if [ -z "$daisy_bin" ]; then
          echo "Packaged Daisy binary not found." >&2
          exit 1
        fi
        uv run --with git+https://github.com/daisy-model/daisypy-test \
          python "$bundle_root/run_packaged_tests.py" \
          --bundle-root "$bundle_root" \
          --daisy-bin "$daisy_bin" \
          --output-root "$PWD/package-test-results"

    - name: Upload packaged test output
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: packaged-test-output-macos-${{ matrix.arch }}
        path: package-test-results
